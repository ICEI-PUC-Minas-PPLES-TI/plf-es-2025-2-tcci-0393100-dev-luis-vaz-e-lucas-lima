services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: buscar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: buscar
      POSTGRES_USER: buscar_user
      POSTGRES_PASSWORD: buscar_password
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    command: postgres -c max_connections=10000 -c shared_buffers=4096MB
    networks:
      - buscar-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: buscar-redis
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - buscar-network

  # Backend API (INTERNO = 3000, EXTERNO = 9004)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buscar-backend
    restart: unless-stopped
    ports:
      - "9004:3000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: buscar
      POSTGRES_USER: buscar_user
      POSTGRES_PASSWORD: buscar_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      SESSION_SECRET: change-me-in-production-please
      CRON_JOB_KEY: ${CRON_JOB_KEY:-default-cron-key-change-me}
      TZ: America/Sao_Paulo
    networks:
      - buscar-network

  # Frontend (INTERNO = 8080, EXTERNO = 9003)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buscar-frontend
    restart: unless-stopped
    ports:
      - "9003:8080"
    environment:
      BACKEND_API_URL: http://backend:3000
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-+5533988154380}
      TZ: America/Sao_Paulo
    networks:
      - buscar-network

  # Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    env_file:
      - .env
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      - TZ=America/Sao_Paulo
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - frontend
    restart: unless-stopped
    container_name: buscar-cloudflare-tunnel
    networks:
      - buscar-network
    profiles:
      - production

  # Scraper Orchestrator
  app-scrappers:
    build:
      context: ./app-scrappers
      dockerfile: Dockerfile
    container_name: buscar-scrappers
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3000
      CRON_JOB_KEY: ${CRON_JOB_KEY:-default-cron-key-change-me}
      ENABLED_SCRAPERS: ${ENABLED_SCRAPERS:-localiza}
      STALE_VEHICLES_DAYS: ${STALE_VEHICLES_DAYS:-3}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MIN_DELAY_SECONDS: ${MIN_DELAY_SECONDS:-300}
      MAX_DELAY_SECONDS: ${MAX_DELAY_SECONDS:-3600}
      TZ: America/Sao_Paulo
    networks:
      - buscar-network
    depends_on:
      - cloudflared
    profiles:
      - production

  # Nginx Proxy (INTERNO = 80, EXTERNO = 9005)
  nginx:
    image: nginx:alpine
    container_name: buscar-nginx
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "9005:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - cloudflared
    networks:
      buscar-network:
        aliases:
          - buscar
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:

networks:
  buscar-network:
